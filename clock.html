<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Exam Clock">
<meta name="theme-color" content="#222222">
<meta name="description" content="A full-screen exam clock with analogue and digital displays, exam times and time remaining. From gcsecs.com.">
<title>Exam Clock · gcsecs.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Atkinson+Hyperlegible:wght@400;700&family=Cormorant+Garamond:wght@600&family=DotGothic16&family=JetBrains+Mono:wght@400;600&family=Nixie+One&family=Oswald:wght@600&display=swap">
<style>
:root{
  --bg:#222222; --primary:#FF8C1A; --secondary:#FFFFFF; --accent:#FF8C1A; --surface:#2E2E2E;
  --muted:#BDBDBD; --track:#444; --rim:#999;
  --ui-font:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);-webkit-text-size-adjust:100%}
body{color:var(--secondary);font-family:var(--ui-font);-webkit-tap-highlight-color:transparent}
body.idle:not(.dlg-open){cursor:none}

/* ---------- Stage (scaled to fit the screen) ---------- */
#viewport{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#stage{position:absolute;left:0;top:0;width:max-content;transform-origin:0 0;display:flex;align-items:center;white-space:nowrap}
#stage *{flex-shrink:0}
#col{display:flex;flex-direction:column;align-items:flex-start}
#analogue{width:640px;height:640px;flex-shrink:0}
#analogue svg{width:100%;height:100%;display:block;overflow:visible}
#label{font-family:var(--ui-font);margin-bottom:18px}
#heading{font-size:72px;line-height:1.05;color:var(--primary)}
#subheading{font-size:36px;line-height:1.25;color:var(--secondary)}
#heading:empty,#subheading:empty{display:none}
#digital{font-size:240px}
#date{font-family:var(--ui-font);font-size:48px;line-height:1.2;color:var(--secondary);margin-top:14px}

.layout-big #analogue{margin-right:90px}
.layout-side #col,.layout-right #col{align-items:center;text-align:center}
#clockPane{position:absolute;display:none}
#clockPane #analogue{width:100%;height:100%;margin:0}
.layout-stacked{flex-direction:column}
.layout-stacked #col{display:contents}
.layout-stacked #label{order:0;text-align:center}
.layout-stacked #analogue{order:1;margin:10px 0 40px}
.layout-stacked #digital{order:2}
.layout-stacked #date{order:3;text-align:center}
.layout-stacked #exam{order:4}

.show-digital #analogue{display:none}
.show-analogue #digital{display:none}
.no-secs .secs,.no-secs .h-sec{display:none!important}
.no-date #date{display:none}
.no-label #label{display:none}
.no-head #heading{display:none}
.no-sub #subheading{display:none}
.no-exam #exStart,.no-exam #exFinish{display:none}
.no-remain #exRem{display:none}
.no-exam.no-remain #exam{display:none}

/* ---------- Location (world clock) ---------- */
#loc{display:inline-flex;align-items:center;gap:14px;margin-bottom:16px;font-family:var(--ui-font);text-align:left}
#flag{width:60px;height:45px;object-fit:cover;border-radius:4px;box-shadow:0 0 0 1px rgba(128,128,128,.35);display:block;flex-shrink:0}
#flag.hide{display:none}
#locName{font-size:36px;line-height:1.05;color:var(--primary)}
#locSub{font-size:22px;line-height:1.25;color:var(--secondary)}
#locSub:empty{display:none}
.no-loc #loc{display:none}
.layout-stacked #loc{order:0}

/* ---------- Analogue faces (theme-following parts) ---------- */
.f-face{fill:var(--surface)}
.s-rim{stroke:var(--rim)}
.s-tick{stroke:var(--primary)}
.f-num{fill:var(--primary)}
.s-hand{stroke:var(--secondary)}
.f-hand{fill:var(--secondary)}
.s-sec{stroke:var(--accent)}
.f-sec{fill:var(--accent)}

/* ---------- Digital styles ---------- */
.d{display:inline-block;text-align:center}
.ap:empty{display:none}

.dg-bold{display:flex;align-items:flex-start;font-family:'Archivo Black','Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:900;line-height:.92;color:var(--primary)}
.dg-bold .hm{display:flex}
.dg-bold .d{width:var(--dw,.7em)}
.dg-bold .c{display:inline-block;width:.3em;text-align:center;transform:translateY(-.04em)}
.dg-bold .ss{font-size:.42em;color:var(--secondary);margin-left:.1em;display:flex;flex-direction:column;align-items:center;line-height:1;margin-top:.02em}
.dg-bold .sdg{display:flex}
.dg-bold .ap{font-family:var(--ui-font);font-weight:700;font-size:.42em;margin-top:.35em}

.dg-plain{display:flex;align-items:baseline;font-family:var(--ui-font);font-weight:700;font-size:.78em;line-height:1;color:var(--primary)}
.dg-plain .d{width:var(--dw,.6em)}
.dg-plain .c{display:inline-block;width:.28em;text-align:center;transform:translateY(-.06em)}
.dg-plain .secs{display:inline-flex;align-items:baseline}
.dg-plain .ap{font-size:.3em;margin-left:.3em}

.dg-dot{background-color:var(--surface);background-image:radial-gradient(rgba(128,128,128,.22) 1.4px,transparent 1.8px);background-size:8px 8px;padding:.1em .18em;border-radius:20px}
.dg-dot .dot-in{display:flex;align-items:baseline;font-family:'DotGothic16','Courier New',monospace;font-size:.66em;line-height:1.05;color:var(--primary);text-shadow:0 0 .06em var(--primary)}
.dg-dot .d{width:var(--dw,.56em)}
.dg-dot .c{display:inline-block;width:.3em;text-align:center}
.dg-dot .secs{display:inline-flex;align-items:baseline}
.dg-dot .ap{font-size:.3em;margin-left:.3em}

.dg-flip{display:flex;align-items:center;font-size:.5em;font-family:'Oswald','Arial Narrow',Arial,sans-serif;font-weight:600;color:var(--primary)}
.dg-flip .fg{display:flex;gap:.06em}
.dg-flip .fcol{font-size:.6em;color:var(--muted);margin:0 .14em;transform:translateY(-.06em)}
.dg-flip .secs.fg{display:flex}
.dg-flip .ap{font-size:.3em;margin-left:.35em;color:var(--secondary)}
.fc{position:relative;width:.76em;height:1.12em;perspective:4em}
.fh{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--surface)}
.ft{top:0;border-radius:.08em .08em 0 0;transform-origin:50% 100%}
.fb{bottom:0;border-radius:0 0 .08em .08em;transform-origin:50% 0}
.fh span{position:absolute;left:0;right:0;height:1.12em;line-height:1.12em;text-align:center}
.ft span{top:0}
.fb span{bottom:0}
.fc::after{content:"";position:absolute;left:0;right:0;top:50%;height:.025em;margin-top:-.0125em;background:var(--bg);z-index:3}
.f1,.f2{visibility:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden;z-index:2}
.fc.go .f1{visibility:visible;animation:flip1 .24s ease-in both}
.fc.go .f2{visibility:visible;animation:flip2 .24s ease-out .24s both}
@keyframes flip1{from{transform:rotateX(0)}to{transform:rotateX(-90deg)}}
@keyframes flip2{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}

.dg-seg{display:flex;align-items:center;gap:.08em;transform:skewX(-6deg)}
.dg-seg .secs{display:flex;align-items:center;gap:.08em}
.sd{position:relative;width:.44em;height:.8em}
.sd i{position:absolute;border-radius:.035em;background:var(--primary);opacity:.1}
.sd i.on{opacity:1;box-shadow:0 0 .05em var(--primary)}
.scol{display:flex;flex-direction:column;gap:.2em;padding:0 .02em}
.scol i{display:block;width:.08em;height:.08em;border-radius:.04em;background:var(--primary);box-shadow:0 0 .05em var(--primary)}
.dg-seg .ap{font-family:var(--ui-font);font-weight:700;font-size:.18em;color:var(--primary);margin-left:.3em}

.dg-nixie{display:flex;align-items:center;gap:.06em;font-size:.7em}
.dg-nixie .grp{display:flex;align-items:center;gap:.06em}
.tube{width:.62em;height:1.12em;border-radius:.31em .31em .12em .12em;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.02));border:.012em solid rgba(160,160,160,.35);display:flex;align-items:center;justify-content:center;font-family:'Nixie One',Georgia,serif;line-height:1;color:var(--primary);text-shadow:0 0 .05em var(--primary),0 0 .18em var(--primary)}
.ncol{display:flex;flex-direction:column;gap:.24em;padding:0 .05em}
.ncol i{display:block;width:.09em;height:.09em;border-radius:50%;background:var(--primary);box-shadow:0 0 .1em var(--primary)}
.dg-nixie .ap{font-family:var(--ui-font);font-weight:700;font-size:.25em;color:var(--primary);margin-left:.3em}

.dg-term{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;background:var(--surface);border-radius:18px;padding:28px 36px;font-size:24px;line-height:1.5;color:var(--secondary);white-space:pre}
.dg-term b{font-weight:400;color:var(--muted)}
.dg-term .tm{color:var(--muted)}
.dg-term .fmt{color:var(--accent)}
.tout{display:flex;align-items:center;gap:14px;font-size:100px;line-height:1.1;font-weight:600;color:var(--primary);margin-top:6px}
.cur{display:inline-block;width:.45em;height:.9em;background:var(--primary);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.dg-bin{display:flex;align-items:flex-start;gap:18px}
.bcol{display:flex;flex-direction:column;align-items:center;gap:18px}
.bcol.bpair{margin-left:34px}
.bit{display:block;width:62px;height:62px;border-radius:50%;box-shadow:inset 0 0 0 5px var(--primary);opacity:.28}
.bit.on{background:var(--primary);opacity:1;box-shadow:0 0 18px var(--primary)}
.bit.none{visibility:hidden}
.bden{font:700 54px/62px var(--ui-font);height:62px;color:var(--secondary)}
.bl{font:700 34px/62px var(--ui-font);height:62px;width:40px;text-align:right;color:var(--muted)}

.dg-hex{display:flex;align-items:flex-start;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;color:var(--primary)}
.hx-pre{font-size:64px;line-height:1;color:var(--muted);margin:62px 14px 0 0}
.hg{display:flex;flex-direction:column;align-items:center}
.hv{font-size:150px;font-weight:600;line-height:1}
.hd{font:700 36px var(--ui-font);color:var(--secondary);margin-top:12px}
.hc{font-size:150px;font-weight:600;line-height:1;color:var(--muted);margin:0 6px}

.dg-unix{display:flex;flex-direction:column;align-items:flex-start;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.layout-side .dg-unix,.layout-right .dg-unix,.layout-stacked .dg-unix{align-items:center}
.ux{font-size:120px;font-weight:600;line-height:1;color:var(--primary)}
.ux-cap{font:400 28px var(--ui-font);color:var(--muted);margin-top:14px}

/* ---------- Exam panel ---------- */
#exam{display:flex;gap:18px;margin-top:44px;font-family:var(--ui-font)}
.layout-side #exam,.layout-right #exam{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.layout-side #exRem,.layout-right #exRem{grid-column:1 / -1;width:auto}
.ex-box{background:var(--surface);border-radius:20px;padding:20px 28px;display:flex;flex-direction:column;gap:8px;min-width:190px;box-sizing:border-box;text-align:left}
.ex-l{font-size:20px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ex-v{font-size:60px;font-weight:700;line-height:1.05;color:var(--secondary)}
#exRem{width:440px}
#exRem .ex-v{color:var(--primary)}
.ex-bar{height:12px;border-radius:6px;background:var(--track);overflow:hidden;margin-top:6px}
#exBar{height:100%;width:0;border-radius:6px;background:var(--accent)}
#exRem.warn1{background:#FFC233}
#exRem.warn1 .ex-l,#exRem.warn1 .ex-v{color:#1A1A1A}
#exRem.warn1 .ex-bar{background:rgba(0,0,0,.18)}
#exRem.warn1 #exBar{background:#1A1A1A}
#exRem.warn2{background:#D92D20}
#exRem.warn2 .ex-l,#exRem.warn2 .ex-v{color:#FFFFFF}
#exRem.warn2 .ex-bar{background:rgba(255,255,255,.3)}
#exRem.warn2 #exBar{background:#FFFFFF}
#exHint{display:none;font-size:16px;font-weight:700;color:#FFFFFF;opacity:.9}
#exRem.flash{cursor:pointer;animation:remFlash 1s steps(1,end) infinite}
#exRem.flash #exHint{display:block}
#exRem.flash:focus-visible{outline:4px solid #FFFFFF;outline-offset:4px}
@keyframes remFlash{0%{background:#D92D20;box-shadow:0 0 0 6px rgba(217,45,32,.45)}50%{background:#6E1209;box-shadow:none}}

/* ---------- Toolbar ---------- */
#toolbar{position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));display:flex;gap:8px;z-index:10;transition:opacity .4s}
#toolbar button{height:44px;min-width:44px;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid rgba(128,128,128,.35);background:rgba(128,128,128,.18);color:var(--secondary);font:700 15px var(--ui-font);cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#toolbar button:hover{background:rgba(128,128,128,.3)}
#toolbar svg{width:20px;height:20px;flex-shrink:0}
body.idle #toolbar{opacity:0;pointer-events:none}
body.no-controls #toolbar{display:none}
@media (max-width:560px){#toolbar button span{display:none}#toolbar button{padding:0 10px}}

/* ---------- Settings drawer ---------- */
#settings{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);display:flex;flex-direction:column;background:#1C1E22;color:#ECEEF1;font-family:var(--ui-font);z-index:20;transform:translateX(105%);transition:transform .25s ease;box-shadow:-10px 0 30px rgba(0,0,0,.35)}
#settings.open{transform:none}
.set-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 14px 20px;border-bottom:1px solid #33373E;padding-top:max(14px,env(safe-area-inset-top))}
.set-head h2{margin:0;font-size:22px}
#btnClose,.dlg-x{width:44px;height:44px;border-radius:10px;border:0;background:transparent;color:#ECEEF1;cursor:pointer;display:flex;align-items:center;justify-content:center}
#btnClose:hover,.dlg-x:hover{background:#2A2D33}
#setBody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 20px 48px;padding-bottom:max(48px,env(safe-area-inset-bottom))}
#setBody h3{margin:26px 0 10px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#A9B0BA}
.ctl{margin:10px 0}
.lab{display:block;font-size:15px;color:#C9CED6;margin-bottom:6px}
.seg{display:flex;gap:3px;padding:3px;border-radius:10px;background:#2A2D33}
.seg button{flex:1;min-height:40px;border:0;border-radius:8px;background:transparent;color:#ECEEF1;font:inherit;font-size:14px;cursor:pointer;padding:0 6px}
.seg button[aria-pressed="true"]{background:#ECEEF1;color:#111418;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid button{min-height:44px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;border:1px solid #3A3F47;background:#24272C;color:#ECEEF1;font:inherit;font-size:14px;text-align:left;cursor:pointer}
.grid button[aria-pressed="true"]{border-color:#FF8C1A;box-shadow:inset 0 0 0 1px #FF8C1A;font-weight:700}
.swatch{width:30px;height:22px;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border:1px solid rgba(255,255,255,.25)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;font-size:15px;cursor:pointer}
.row input[type=checkbox]{-webkit-appearance:none;appearance:none;width:46px;height:28px;border-radius:14px;background:#3A3F47;position:relative;flex-shrink:0;margin:0;cursor:pointer;transition:background .2s}
.row input[type=checkbox]::before{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.row input[type=checkbox]:checked{background:#FF8C1A}
.row input[type=checkbox]:checked::before{transform:translateX(18px)}
.field{width:100%;box-sizing:border-box;min-height:44px;padding:0 12px;border-radius:8px;border:1px solid #3A3F47;background:#24272C;color:#ECEEF1;font:inherit;font-size:16px}
.row .field{width:140px}
.row input[type=color]{width:56px;height:38px;padding:2px;border-radius:8px;border:1px solid #3A3F47;background:#24272C;cursor:pointer;flex-shrink:0}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid #3A3F47;background:#2A2D33;color:#ECEEF1;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.btn:hover{background:#33373E}
.hint{font-size:13px;color:#A9B0BA;line-height:1.45;margin:8px 0 0}
select.field option,select.field optgroup{background:#24272C;color:#ECEEF1}
#shareOut{margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:12px;min-height:72px;padding:8px 10px;resize:vertical}
#settings :focus-visible,#toolbar :focus-visible{outline:2px solid #FF8C1A;outline-offset:2px}

/* ---------- Toast ---------- */
/* ---------- Start exam dialog ---------- */
#examDlgWrap{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
#examDlgWrap[hidden]{display:none}
#examDlg{width:min(460px,100%);max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#1C1E22;color:#ECEEF1;border-radius:16px;font-family:var(--ui-font);box-shadow:0 20px 60px rgba(0,0,0,.5)}
#examDlg .set-head{padding-top:14px}
.dlg-body{padding:6px 20px 22px}
.len-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.len-row label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:#C9CED6}
.len-row .field{font-size:24px;font-weight:700;min-height:54px}
.grid.quick{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:12px}
.grid.quick button{justify-content:center;text-align:center}
.preview{margin:18px 0 4px;padding:14px 16px;border-radius:10px;background:#24272C;font-size:19px;line-height:1.45}
.preview strong{color:#FF8C1A;font-size:24px}
.dlg-btns{display:flex;gap:10px;margin-top:18px}
.dlg-btns .btn{flex:1;min-height:54px;font-size:17px}
.btn.primary{background:#FF8C1A;border-color:#FF8C1A;color:#111418}
.btn.primary:hover{background:#FFA243}
.btn:disabled{opacity:.45;cursor:not-allowed}
#exRunning{margin-top:20px;padding-top:4px;border-top:1px solid #33373E}
#exRunning[hidden]{display:none}
#examDlg :focus-visible{outline:2px solid #FF8C1A;outline-offset:2px}
body.no-startbtn #btnExam{display:none}

#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(560px,90vw);padding:12px 16px;border-radius:10px;background:rgba(20,20,22,.94);color:#fff;font:15px/1.4 var(--ui-font);z-index:30;opacity:0;pointer-events:none;transition:opacity .3s;text-align:center;white-space:normal}
#toast.show{opacity:1}

@media (prefers-reduced-motion:reduce){.fc.go .f1,.fc.go .f2{animation:none;visibility:hidden}.cur{animation:none}#exRem.flash{animation-duration:2s}}
</style>
</head>
<body>
<div id="viewport">
  <div id="clockPane"></div>
  <div id="stage" class="layout-big show-digital">
    <div id="analogue"></div>
    <div id="col">
      <div id="loc"><img id="flag" alt="" width="60" height="45"><div><div id="locName"></div><div id="locSub"></div></div></div>
      <header id="label"><div id="heading"></div><div id="subheading"></div></header>
      <div id="digital" role="timer" aria-live="off"></div>
      <div id="date"></div>
      <section id="exam" aria-label="Exam times">
        <div class="ex-box" id="exStart"><span class="ex-l">Start</span><span class="ex-v" id="exStartV"></span></div>
        <div class="ex-box" id="exFinish"><span class="ex-l">Finish</span><span class="ex-v" id="exFinishV"></span></div>
        <div class="ex-box" id="exRem"><span class="ex-l" id="exRemL">Time remaining</span><span class="ex-v" id="exRemV"></span><div class="ex-bar"><div id="exBar"></div></div><span id="exHint">Tap or click to stop flashing</span></div>
      </section>
    </div>
  </div>
</div>

<div id="toolbar">
  <button id="btnExam" type="button" aria-label="Start exam" aria-haspopup="dialog" aria-controls="examDlgWrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="14" r="7"/><line x1="12" y1="14" x2="12" y2="10.5"/><line x1="10" y1="3" x2="14" y2="3"/><line x1="12" y1="3" x2="12" y2="7"/><line x1="18.5" y1="7.5" x2="19.8" y2="6.2"/></svg>
    <span>Start exam</span>
  </button>
  <button id="btnSettings" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings">

      var id = 'f-' + it.k;
      var l2 = el('label', 'lab'); l2.htmlFor = id; l2.textContent = it.label;
      var inp = el('input', 'field'); inp.type = 'text'; inp.id = id; inp.maxLength = 80; inp.setAttribute('data-k', it.k);
      inp.addEventListener('input', function () { setVal(it.k, inp.value); });
      w.appendChild(l2); w.appendChild(inp);
    } else if (it.t === 'time' || it.t === 'number' || it.t === 'color') {
      var l3 = el('label', 'row');
      l3.appendChild(el('span')).textContent = it.label;
      var f = el('input', it.t === 'color' ? null : 'field');
      f.type = it.t; f.setAttribute('data-k', it.k);
      if (it.t === 'number') { f.min = 1; f.max = 180; f.inputMode = 'numeric'; }
      if (it.t === 'time') f.step = 60;
      f.addEventListener(it.t === 'color' ? 'input' : 'change', function () {
        setVal(it.k, it.t === 'number' ? parseInt(f.value, 10) : f.value);
      });
      l3.appendChild(f); w.appendChild(l3);
    } else if (it.t === 'select') {
      var sid = 'f-' + it.k;
      var l4 = el('label', 'lab'); l4.htmlFor = sid; l4.textContent = it.label;
      var sel = el('select', 'field'); sel.id = sid; sel.setAttribute('data-k', it.k);
      var addOpt = function (parent, v, text) { var o = el('option'); o.value = v; o.textContent = text; parent.appendChild(o); };
      var devLabel = 'This device (automatic)';
      addOpt(sel, 'auto', devLabel);
      addOpt(sel, 'utc', 'UTC (Coordinated Universal Time)');
      var groups = {};
      CITIES.slice().sort(function (a, b) { return a[1].localeCompare(b[1]); }).forEach(function (c) {
        if (!groups[c[5]]) { groups[c[5]] = el('optgroup'); groups[c[5]].label = c[5]; }
        addOpt(groups[c[5]], c[0], c[1] === c[2] ? c[1] : c[1] + ', ' + c[2]);
      });
      ['Europe', 'Americas', 'Africa', 'Middle East and Asia', 'Oceania'].forEach(function (g) { if (groups[g]) sel.appendChild(groups[g]); });
      sel.addEventListener('change', function () { setVal(it.k, sel.value); });
      w.appendChild(l4); w.appendChild(sel);
    } else if (it.t === 'hint') {
      w.appendChild(el('p', 'hint')).textContent = it.text;
    } else if (it.t === 'share') {
      w.innerHTML = '<span class="lab">Share or embed these settings</span>' +
        '<div class="btns"><button type="button" class="btn" id="btnLink">Copy link</button><button type="button" class="btn" id="btnEmbed">Copy embed code</button></div>' +
        '<textarea id="shareOut" class="field" readonly aria-label="Link or embed code" rows="3"></textarea>' +
        '<p class="hint">Links open the clock with exactly these settings. Keyboard: E starts an exam, S opens settings, F toggles full screen.</p>';
      w.querySelector('#btnLink').addEventListener('click', function () { copyOut(shareURL(), 'Link copied'); });
      w.querySelector('#btnEmbed').addEventListener('click', function () {
        copyOut('<iframe src="' + shareURL() + '" title="Exam clock" style="width:100%;aspect-ratio:16/9;border:0" allow="fullscreen; screen-wake-lock" allowfullscreen></iframe>', 'Embed code copied');
      });
    } else if (it.t === 'reset') {
      w.innerHTML = '<div class="btns"><button type="button" class="btn" id="btnResetCol">Reset colours</button><button type="button" class="btn" id="btnResetAll">Reset everything</button></div>';
      w.querySelector('#btnResetCol').addEventListener('click', function () { setVal('theme', 'dark'); });
      w.querySelector('#btnResetAll').addEventListener('click', function () {
        if (!window.confirm('Reset all clock settings to the defaults?')) return;
        S = Object.assign({}, DEFAULTS); save(); apply(); syncSettings();
      });
    }
    return w;
  }

  function buildSettings() {
    var body = $('#setBody');
    SCHEMA.forEach(function (sec) {
      body.appendChild(el('h3', null, null)).textContent = sec.title;
      sec.items.forEach(function (it) { body.appendChild(control(it)); });
    });
  }
  function syncSettings() {
    var nodes = document.querySelectorAll('#setBody [data-k]');
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i], k = n.getAttribute('data-k');
      if (n.tagName === 'BUTTON') n.setAttribute('aria-pressed', String(String(S[k]) === n.getAttribute('data-v')));
      else if (n.type === 'checkbox') n.checked = !!S[k];
      else if (document.activeElement !== n) n.value = S[k];
    }
  }

  function shareURL() {
    var p = new URLSearchParams();
    Object.keys(DEFAULTS).forEach(function (k) {
      if (S[k] === DEFAULTS[k] || k === 'startedAt') return;
      if (COLOUR_KEYS.indexOf(k) !== -1 && S.theme !== 'custom') return;
      var v = S[k];
      if (typeof v === 'boolean') v = v ? '1' : '0';
      else if (COLOUR_KEYS.indexOf(k) !== -1) v = String(v).replace('#', '');
      p.set(k, v);
    });
    var q = p.toString();
    return location.origin + location.pathname + (q ? '?' + q : '');
  }
  function copyOut(text, msg) {
    var out = $('#shareOut'); out.value = text;
    var fallback = function () { out.focus(); out.select(); toast('Select the text below and copy it (Ctrl+C or ⌘C).'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast(msg); }, fallback);
    else fallback();
  }

  var drawer = $('#settings'), btnSet = $('#btnSettings');
  function openSettings(open) {
    drawer.classList.toggle('open', open);
    drawer.setAttribute('aria-hidden', String(!open));
    if (open) drawer.removeAttribute('inert'); else drawer.setAttribute('inert', '');
    btnSet.setAttribute('aria-expanded', String(open));
    document.body.classList.toggle('settings-open', open);
    if (open) { syncSettings(); $('#btnClose').focus(); poke(); }
  }
  btnSet.addEventListener('click', function () { openSettings(!drawer.classList.contains('open')); });
  $('#btnClose').addEventListener('click', function () { openSettings(false); btnSet.focus(); });
  $('#btnFull').addEventListener('click', toggleFS);
  $('#viewport').addEventListener('click', function () { if (drawer.classList.contains('open')) openSettings(false); });
  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (!dlgWrap.hidden) return;
    if (e.key === 'Escape' && drawer.classList.contains('open')) { openSettings(false); return; }
    if (/INPUT|TEXTAREA|SELECT/.test(tag) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 's' || e.key === 'S') { openSettings(!drawer.classList.contains('open')); }
    else if (e.key === 'f' || e.key === 'F') { toggleFS(); }
    else if ((e.key === 'e' || e.key === 'E') && S.startBtn) { openExamDlg(); }
  });

  /* ================= Start exam dialog ================= */
  var dlgWrap = $('#examDlgWrap'), btnExam = $('#btnExam'), lenH = $('#lenH'), lenM = $('#lenM');
  var QUICK = [[45, '45 min'], [60, '1 h'], [75, '1 h 15'], [90, '1 h 30'], [105, '1 h 45'], [120, '2 h']];
  var dlgTimer = null;
  QUICK.forEach(function (q) {
    var b = el('button'); b.type = 'button'; b.textContent = q[1]; b.setAttribute('data-len', q[0]);
    b.addEventListener('click', function () { setLenInputs(q[0]); updatePreview(); });
    $('#quickLens').appendChild(b);
  });
  function clampInt(v, lo, hi) { var n = parseInt(v, 10); return isNaN(n) ? 0 : Math.min(hi, Math.max(lo, n)); }
  function readLen() { return clampInt(lenH.value, 0, 9) * 60 + clampInt(lenM.value, 0, 59); }
  function setLenInputs(mins) { lenH.value = Math.floor(mins / 60); lenM.value = mins % 60; }
  function hhmm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function zonedNow() {
    var real = new Date(), tz = activeTz();
    return new Date(real.getTime() + (tz ? shiftFor(tz, real) : 0));
  }
  function planTimes(len) {
    var zn = zonedNow(), st = new Date(zn.getTime());
    st.setSeconds(0, 0);
    if (st < zn) st = new Date(st.getTime() + 60000);
    var fi = new Date(st.getTime() + len * 60000);
    return { now: zn, start: st, finish: fi, rounded: st.getTime() !== zn.getTime(), overnight: fi.getDate() !== st.getDate() };
  }
  function runningExam() {
    if (!S.startedAt || !S.examOn) return null;
    var zn = zonedNow(), fi = atToday(S.finish, zn), st = atToday(S.start, zn);
    if (!fi || !st || zn >= fi || st.getTime() - S.startedAt >= 60000 || S.startedAt > st.getTime()) return null;
    return { start: S.start, finish: S.finish };
  }
  function updatePreview() {
    var len = readLen(), go = $('#exGo'), pv = $('#exPreview');
    var btns = $('#quickLens').children;
    for (var i = 0; i < btns.length; i++) btns[i].setAttribute('aria-pressed', String(+btns[i].getAttribute('data-len') === len));
    if (len < 1) { pv.textContent = 'Enter how long the exam lasts.'; go.disabled = true; return; }
    var t = planTimes(len);
    if (t.overnight) { pv.textContent = 'That would finish after midnight. Choose a shorter length.'; go.disabled = true; return; }
    go.disabled = false;
    pv.innerHTML = 'Start <strong>' + fmtClock(hhmm(t.start)) + '</strong> &nbsp;→&nbsp; Finish <strong>' + fmtClock(hhmm(t.finish)) + '</strong>';
    $('#exRoundNote').hidden = !t.rounded;
  }
  function openExamDlg() {
    if (drawer.classList.contains('open')) openSettings(false);
    setLenInputs(S.examLen);
    $('#exRemOn').checked = S.startedAt ? S.remainOn : true;
    var run = runningExam();
    $('#exRunning').hidden = !run;
    if (run) $('#exRunTxt').textContent = 'An exam is running from ' + fmtClock(run.start) + ' to ' + fmtClock(run.finish) + '. Starting now will replace these times.';
    updatePreview();
    dlgWrap.hidden = false;
    document.body.classList.add('dlg-open');
    btnExam.setAttribute('aria-expanded', 'true');
    clearInterval(dlgTimer); dlgTimer = setInterval(updatePreview, 1000);
    poke();
    lenH.focus(); lenH.select();
  }
  function closeExamDlg() {
    if (dlgWrap.hidden) return;
    dlgWrap.hidden = true;
    document.body.classList.remove('dlg-open');
    btnExam.setAttribute('aria-expanded', 'false');
    clearInterval(dlgTimer);
    btnExam.focus();
    poke();
  }
  function startExamNow() {
    var len = readLen();
    if (len < 1) return;
    var t = planTimes(len);
    if (t.overnight) return;
    S.start = hhmm(t.start); S.finish = hhmm(t.finish); S.startedAt = t.now.getTime();
    S.examLen = len; S.examOn = true; S.remainOn = $('#exRemOn').checked;
    flashOffKey = '';
    sanitise(S); save(); apply(); syncSettings();
    closeExamDlg();
    toast('Exam started: ' + fmtClock(S.start) + ' to ' + fmtClock(S.finish));
  }
  function clearExam() {
    S.examOn = false; S.remainOn = false; S.startedAt = 0;
    save(); apply(); syncSettings();
    closeExamDlg();
    toast('Exam times cleared');
  }
  btnExam.addEventListener('click', openExamDlg);
  $('#exDlgClose').addEventListener('click', closeExamDlg);
  $('#exCancel').addEventListener('click', closeExamDlg);
  $('#exGo').addEventListener('click', startExamNow);
  $('#exClear').addEventListener('click', clearExam);
  dlgWrap.addEventListener('click', function (e) { if (e.target === dlgWrap) closeExamDlg(); });
  [lenH, lenM].forEach(function (inp) {
    inp.addEventListener('input', updatePreview);
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); startExamNow(); } });
  });
  dlgWrap.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeExamDlg(); return; }
    if (e.key !== 'Tab') return;
    var f = Array.prototype.filter.call(dlgWrap.querySelectorAll('button,input'), function (n) { return !n.disabled && n.offsetParent !== null; });
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  /* ================= Auto-hide controls ================= */
  var idleT;
  function poke() {
    document.body.classList.remove('idle');
    clearTimeout(idleT);
    idleT = setTimeout(function () { if (!drawer.classList.contains('open') && dlgWrap.hidden) document.body.classList.add('idle'); }, 3000);
  }
  ['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach(function (ev) { window.addEventListener(ev, poke, { passive: true }); });

  /* ================= Start ================= */
  drawer.setAttribute('inert', '');
  buildSettings();
  apply();
  syncSettings();
  poke();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
